name = "adaly_lemma"
version = "0.1.0"
# One Lake project holding every Lean module in the import cone of every declaration cited in
# paper/CLAIMS.tsv.  Two libraries because the frozen sources were built with two option sets:
#   AdalyFormalLib : modules named AdalyFormal.*  (options below)
#   AdalyFlatLib   : flat-named lane modules (RI6, ZT5A, TT_F, ...) and R7Fork.*, built with -DautoImplicit=false only
